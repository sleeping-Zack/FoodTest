<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' file: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>@@TITLE@@ · 原文切分</title>
<link rel="stylesheet" href="@@RESOURCES@@/vendor/katex/katex.min.css">
<link rel="stylesheet" href="@@RESOURCES@@/viewer.css">
<script defer src="@@RESOURCES@@/vendor/markdown-it/markdown-it.min.js"></script>
<script defer src="@@RESOURCES@@/vendor/katex/katex.min.js"></script>
<script defer src="@@RESOURCES@@/viewer.js"></script>
</head>
<body>
<header class="masthead"><div class="brand-mark" aria-hidden="true">原</div><div><div class="eyebrow">食品标准知识库 / 原文切分</div><h1 id="document-title">@@TITLE@@</h1></div><span class="offline">● 离线查看</span></header>
<section class="intro"><div><p class="intro-title">每个片段，都能回到完整依据。</p><p>查看实际切分结果，展开适用范围、完整方法和脚注，再与原页对照。</p></div><div class="statistics"><div><strong id="total-count">—</strong><span>可检索片段</span></div><div><strong id="row-count">—</strong><span>表格行</span></div><div><strong id="cross-count">—</strong><span>跨页片段</span></div></div></section>
<div class="workspace"><aside class="sidebar"><label class="search-label" for="search">查找片段</label><div class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索项目、方法、原文…" autocomplete="off"></div><div id="filters" class="filters" aria-label="按内容分类"></div><label class="context-toggle"><input id="include-context" type="checkbox"> 同时显示目录与整表 <span id="context-only-count"></span></label><div class="list-heading"><span id="list-count" aria-live="polite"></span><button id="clear-search" class="text-button" type="button" hidden>清除筛选</button></div><nav id="chunk-list" aria-label="切分片段列表"></nav><p id="empty-list" class="empty" hidden>没有匹配片段。试试项目名称或方法编号。</p></aside>
<main id="reader"><div id="empty-reader" class="empty" hidden>尚无可展示的切分片段。</div><article id="selected"><div id="heading-path" class="breadcrumbs"></div><div class="title-row"><div><div id="kind-label" class="section-label"></div><h2 id="chunk-title"></h2></div><span class="review-state">待审核 · 不用于自动判定</span></div><div id="source-actions" class="source-actions"></div><div id="quality-note" class="quality-note" hidden></div><section id="row-facts" class="row-facts" hidden></section><section class="excerpt-section"><div class="section-heading"><h3>切分后的原文</h3><span id="source-location"></span></div><div id="raw-content" class="markdown"></div></section><section class="context-section"><div class="section-heading"><h3>把上下文接回来</h3><span>按需展开，与原文保持关联</span></div><div id="context-budget" class="quality-note" hidden></div><div id="context-list"></div><p id="empty-context" class="empty" hidden>这个片段没有额外关联的上下文。</p></section><details class="trace-details"><summary>来源与切分记录</summary><dl id="trace-data"></dl><button id="download" class="secondary-button" type="button">下载完整切分结果</button><p>下载内容包含片段、原始定位和关联；不会修改原件。</p></details></article></main></div>
<footer>原件 → 结构切分 → 上下文关联 <span>本页展示来源材料，尚未形成经审核的判定规则。</span></footer>
<dialog id="page-dialog"><div class="dialog-top"><div><strong id="page-title"></strong><span id="printed-page"></span></div><div class="dialog-tools"><a id="dialog-pdf" class="secondary-button" target="_blank" rel="noopener noreferrer">打开 PDF</a><button id="close-page" type="button" aria-label="关闭原页">×</button></div></div><div class="page-image-wrap"><img id="page-image" alt="标准原件页面"></div></dialog>
<script id="viewer-data" type="application/json">@@DATA@@</script>
</body></html>
