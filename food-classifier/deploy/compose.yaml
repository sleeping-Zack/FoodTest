services:
  classifier:
    build:
      context: ../..
      dockerfile: food-classifier/deploy/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${FOODTEST_DOMAIN:?Set FOODTEST_DOMAIN in .env}
    volumes:
      - type: bind
        source: ./library/references
        target: /app/references
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./library/food-classifier/resources/guide-pages.json
        target: /app/food-classifier/resources/guide-pages.json
        read_only: true
        bind:
          create_host_path: false
      - query_data:/var/lib/food-classifier
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    logging:
      options:
        max-size: 10m
        max-file: '3'
  gateway:
    image: caddy:2
    restart: unless-stopped
    environment:
      FOODTEST_DOMAIN: ${FOODTEST_DOMAIN:?Set FOODTEST_DOMAIN in .env}
    depends_on:
      classifier:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      options:
        max-size: 10m
        max-file: '3'
volumes:
  query_data:
  caddy_data:
  caddy_config:
